<div class="contenido">
  <h1>Ejercicio 7: Menú desplegable</h1>
  <p>Arriba a la izquierda para ver el menú desplegable.</p>
  <p><a href="index.html">Volver al menú principal</a></p>
</div>

<script>
  function ocultarTodos() {
    var submenus = document.getElementsByClassName("submenu");
    for (var i = 0; i < submenus.length; i++) {
      submenus[i].classList.remove("visible");
      submenus[i].style.display = "none";
    }
  }

  function mostrarSubmenu(evento, id) {
    evento.preventDefault();
    evento.stopPropagation();

    var submenu = document.getElementById(id);
    var estabaVisible = submenu.classList.contains("visible");

    ocultarTodos();

    if (!estabaVisible) {
      submenu.classList.add("visible");
      submenu.style.display = "block";
    }
  }

  ocultarTodos();
  document.addEventListener("click", ocultarTodos);
</script>
